[package]
name = "mod-account_switcher"
version = "1.0.1"
edition = "2024"
authors = ["cosmo-jar"]
license = "GPL-3.0"
repository = "https://github.com/cosmo-jar/Horizon-Account-Switcher"
description = "Liquid-glass in-game Microsoft & offline account switcher with encrypted vault storage for Horizon."

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
open = "5"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.10.9"

[lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
