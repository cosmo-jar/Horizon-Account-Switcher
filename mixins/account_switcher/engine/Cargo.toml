[package]
name = "account_switcher_engine"
version = "1.0.0"
edition = "2024"
authors = ["cosmo-jar"]
license = "GPL-3.0"
repository = "https://github.com/cosmo-jar/Horizon-Account-Switcher"
description = "Core domain, encrypted storage, OAuth providers, skin cache, and liquid-glass UI controller for Horizon Account Switcher"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
open = "5"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.10.9"
ureq = { version = "2", default-features = false, features = ["tls"] }

[lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
